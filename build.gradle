// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '2.2.0'
    }
    dependencies {
        classpath "io.objectbox:objectbox-gradle-plugin:5.0.1"
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'
        classpath 'com.jaredsburrows:gradle-license-plugin:0.9.8'
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.10"
    }
    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

plugins {
    id 'com.android.application' version '9.3.2' apply false
    id 'com.android.library' version '9.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir()
}
